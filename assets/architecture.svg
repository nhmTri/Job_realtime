<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Streaming architecture from two job boards through Kafka and Spark to Cassandra, MySQL and Grafana.">
  <style>
    .t{font:600 12px ui-monospace,Menlo,monospace;fill:#3C4354;letter-spacing:.05em}
    .s{font:400 9.5px ui-monospace,Menlo,monospace;fill:#8892A6}
    .k{font:500 10px ui-monospace,Menlo,monospace;fill:#8892A6;letter-spacing:.16em}
    .b{fill:#2456D6;fill-opacity:.05;stroke:#2456D6;stroke-opacity:.4;stroke-width:1.4}
    .braw{fill:#C2703A;fill-opacity:.07;stroke:#C2703A;stroke-opacity:.5;stroke-width:1.4}
    .bser{fill:#1F7A5A;fill-opacity:.07;stroke:#1F7A5A;stroke-opacity:.5;stroke-width:1.4}
    .w{stroke:#8892A6;stroke-opacity:.5;stroke-width:1.3;fill:none}
    .p{fill:#2456D6}
    .warn{stroke:#C0392B;stroke-width:1.3;stroke-dasharray:4 4;fill:none;opacity:.8}
    .wt{font:600 10px ui-monospace,Menlo,monospace;fill:#C0392B}
  </style>
  <text class="k" x="28" y="24">BUFFER &#183; REPLAY &#183; SERVE &#183; MONITOR</text>

  <g transform="translate(28,40)">
    <rect class="b" x="0" y="0" width="112" height="34" rx="8"/>
    <text class="t" x="56" y="21" text-anchor="middle">VietnamWorks</text>
    <rect class="b" x="0" y="46" width="112" height="34" rx="8"/>
    <text class="t" x="56" y="67" text-anchor="middle">CareerViet</text>

    <rect class="b" x="152" y="14" width="104" height="52" rx="9"/>
    <text class="t" x="204" y="36" text-anchor="middle">SCRAPER</text>
    <text class="s" x="204" y="52" text-anchor="middle">Selenium &#183; Redis</text>

    <rect class="b" x="276" y="14" width="96" height="52" rx="9"/>
    <text class="t" x="324" y="36" text-anchor="middle">KAFKA</text>
    <text class="s" x="324" y="52" text-anchor="middle">buffer</text>

    <rect class="b" x="392" y="14" width="124" height="52" rx="9"/>
    <text class="t" x="454" y="36" text-anchor="middle">SPARK STREAM</text>
    <text class="s" x="454" y="52" text-anchor="middle">parse &#183; dedupe</text>

    <rect class="braw" x="536" y="14" width="112" height="52" rx="9"/>
    <text class="t" x="592" y="36" text-anchor="middle">CASSANDRA</text>
    <text class="s" x="592" y="52" text-anchor="middle">immutable raw</text>

    <rect class="bser" x="668" y="14" width="104" height="52" rx="9"/>
    <text class="t" x="720" y="36" text-anchor="middle">MySQL</text>
    <text class="s" x="720" y="52" text-anchor="middle">serving &#183; CDC</text>

    <rect class="bser" x="792" y="14" width="110" height="52" rx="9"/>
    <text class="t" x="847" y="36" text-anchor="middle">GRAFANA</text>
    <text class="s" x="847" y="52" text-anchor="middle">per source</text>

    <path class="w" d="M112 17 C130 17 134 40 152 40 M112 63 C130 63 134 40 152 40 M256 40 H276 M372 40 H392 M516 40 H536 M648 40 H668 M772 40 H792"/>
    <circle class="p" r="3.4"><animateMotion dur="4.4s" repeatCount="indefinite" path="M112 17 C130 17 134 40 152 40 M256 40 H276 M372 40 H392 M516 40 H536 M648 40 H668 M772 40 H792"/></circle>
    <circle class="p" r="3.4" opacity=".6"><animateMotion dur="4.4s" begin="-2.2s" repeatCount="indefinite" path="M112 63 C130 63 134 40 152 40 M256 40 H276 M372 40 H392 M516 40 H536 M648 40 H668 M772 40 H792"/></circle>

    <path class="w" d="M592 66 V108 H454 V66" stroke-dasharray="3 4"/>
    <text class="s" x="524" y="122" text-anchor="middle">every downstream table rebuildable by replay</text>
  </g>

  <g transform="translate(28,190)">
    <path class="warn" d="M0 10 H960"/>
    <rect x="0" y="0" width="2" height="0" fill="none"/>
    <text class="wt" x="0" y="34">A silent source looks exactly like a market with no new jobs.</text>
    <text class="s" x="0" y="52">Totals hide it. Only per-source monitoring tells them apart &#8212; so Grafana watches each source separately.</text>
  </g>
</svg>
