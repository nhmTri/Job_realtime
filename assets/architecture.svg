<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Two job boards are scraped into Kafka, parsed by Spark Streaming, written to Cassandra as the immutable raw layer and to MySQL for serving, with Grafana watching each source separately.">
  <style>
    :root{color-scheme:light dark}
    .ttl{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#2456D6;letter-spacing:.14em}
    .nm{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1B2030}
    .sub{font:400 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6}
    .tag{font:600 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#8892A6;letter-spacing:.18em}
    .num{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1F7A5A}
    .box{fill:#FFFFFF;stroke:#D6DBE6;stroke-width:1.5;rx:8}
    .wire{fill:none;stroke:#C3CAD8;stroke-width:1.6}
    .flow{fill:none;stroke:#2456D6;stroke-width:2;stroke-linecap:round;
          stroke-dasharray:7 13;animation:dash 1.1s linear infinite}
    .flow.slow{animation-duration:1.7s;stroke:#C2703A}
    .flow.green{animation-duration:1.4s;stroke:#1F7A5A}
    @keyframes dash{to{stroke-dashoffset:-20}}

    .pulse{animation:pulse 2.6s ease-in-out infinite}
    .pulse.d1{animation-delay:.5s} .pulse.d2{animation-delay:1s} .pulse.d3{animation-delay:1.5s}
    @keyframes pulse{0%,100%{opacity:.25}45%{opacity:1}}

    .par{fill:#2456D6;opacity:.18}
    .fill{fill:#2456D6;transform-box:fill-box;transform-origin:bottom;animation:fill 2.8s cubic-bezier(.4,0,.2,1) infinite}
    .fill.b{animation-delay:.35s} .fill.c{animation-delay:.7s}
    @keyframes fill{0%{transform:scaleY(.05)}55%{transform:scaleY(1)}100%{transform:scaleY(.05)}}

    .spark{transform-origin:center;animation:spin 7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 3.2s ease-in-out infinite}
    .bar:nth-of-type(2){animation-delay:.25s}
    .bar:nth-of-type(3){animation-delay:.5s}
    .bar:nth-of-type(4){animation-delay:.75s}
    .bar:nth-of-type(5){animation-delay:1s}
    @keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

    .beat{animation:beat 2.2s ease-in-out infinite}
    @keyframes beat{0%,100%{r:3.5;opacity:1}50%{r:5.5;opacity:.45}}

    @media (prefers-reduced-motion:reduce){
      .flow,.pulse,.fill,.spark,.bar,.beat{animation:none}
      .fill{transform:scaleY(.8)}
    }
    @media (prefers-color-scheme:dark){
      .box{fill:#161B24;stroke:#2B3443}
      .nm{fill:#E8ECF4}
      .sub,.tag{fill:#7F8AA0}
      .wire{stroke:#394354}
    }
  </style>

  <!-- = sources -->
  <text class="tag" x="36" y="40">SOURCES</text>
  <rect class="box" x="30" y="56" width="132" height="44"/>
  <circle class="beat" cx="48" cy="78" r="3.5" fill="#1F7A5A"/>
  <text class="nm"  x="62" y="76">VietnamWorks</text>
  <text class="sub" x="62" y="90">every 15 min</text>

  <rect class="box" x="30" y="150" width="132" height="44"/>
  <circle class="beat" cx="48" cy="172" r="3.5" fill="#1F7A5A" style="animation-delay:1.1s"/>
  <text class="nm"  x="62" y="170">CareerViet</text>
  <text class="sub" x="62" y="184">every 15 min</text>

  <path class="wire" d="M162 78 H198 Q210 78 210 90 V118"/>
  <path class="wire" d="M162 172 H198 Q210 172 210 160 V134"/>
  <path class="flow" d="M162 78 H198 Q210 78 210 90 V118"/>
  <path class="flow slow" d="M162 172 H198 Q210 172 210 160 V134"/>

  <!-- = scraper -->
  <rect class="box" x="166" y="118" width="88" height="48"/>
  <text class="nm"  x="180" y="140">SCRAPER</text>
  <text class="sub" x="180" y="154">Selenium</text>
  <path class="wire" d="M254 142 H300"/>
  <path class="flow" d="M254 142 H300"/>

  <!-- = kafka -->
  <text class="tag" x="304" y="96">KAFKA · BUFFER</text>
  <rect class="box" x="300" y="106" width="118" height="72"/>
  <g>
    <rect class="par" x="316" y="122" width="22" height="42" rx="2"/>
    <rect class="par" x="348" y="122" width="22" height="42" rx="2"/>
    <rect class="par" x="380" y="122" width="22" height="42" rx="2"/>
    <rect class="fill"   x="316" y="122" width="22" height="42" rx="2"/>
    <rect class="fill b" x="348" y="122" width="22" height="42" rx="2"/>
    <rect class="fill c" x="380" y="122" width="22" height="42" rx="2"/>
  </g>
  <text class="sub" x="300" y="194">3 partitions · replayable</text>
  <path class="wire" d="M418 142 H466"/>
  <path class="flow" d="M418 142 H466"/>

  <!-- = spark -->
  <rect class="box" x="466" y="106" width="118" height="72"/>
  <circle class="spark" cx="496" cy="132" r="11" fill="none" stroke="#C2703A" stroke-width="2" stroke-dasharray="14 9" style="transform-box:fill-box"/>
  <text class="nm"  x="514" y="130">SPARK</text>
  <text class="sub" x="482" y="152">parse · dedupe</text>
  <text class="sub" x="482" y="166">micro-batch 30s</text>

  <path class="wire" d="M584 130 H640 Q652 130 652 118 V86"/>
  <path class="wire" d="M584 154 H640 Q652 154 652 166 V198"/>
  <path class="flow green" d="M584 130 H640 Q652 130 652 118 V86"/>
  <path class="flow slow"  d="M584 154 H640 Q652 154 652 166 V198"/>

  <!-- = two stores -->
  <rect class="box" x="608" y="36" width="150" height="50"/>
  <text class="nm"  x="624" y="58">CASSANDRA</text>
  <text class="sub" x="624" y="72">immutable raw · append only</text>

  <rect class="box" x="608" y="198" width="150" height="50"/>
  <text class="nm"  x="624" y="220">MySQL</text>
  <text class="sub" x="624" y="234">serving · CDC</text>

  <!-- replay arc: raw can rebuild serving -->
  <path class="wire" d="M758 61 Q830 61 830 142 Q830 223 758 223" stroke-dasharray="3 5"/>
  <text class="tag" x="786" y="138" fill="#C2703A">REPLAY</text>
  <text class="tag" x="786" y="150" fill="#C2703A">REBUILDS</text>

  <!-- = grafana -->
  <text class="tag" x="866" y="96">GRAFANA</text>
  <rect class="box" x="862" y="106" width="108" height="72"/>
  <rect class="bar" x="876" y="128" width="12" height="38" rx="2" fill="#2456D6"/>
  <rect class="bar" x="894" y="128" width="12" height="38" rx="2" fill="#2456D6"/>
  <rect class="bar" x="912" y="128" width="12" height="38" rx="2" fill="#C2703A"/>
  <rect class="bar" x="930" y="128" width="12" height="38" rx="2" fill="#2456D6"/>
  <rect class="bar" x="948" y="128" width="12" height="38" rx="2" fill="#2456D6"/>
  <text class="sub" x="862" y="194">one chart per source</text>
  <path class="wire" d="M758 223 H820 Q840 223 840 200 V142 H862" stroke-dasharray="3 5"/>

  <!-- = note -->
  <text class="ttl" x="30" y="282">A SILENT SOURCE LOOKS EXACTLY LIKE A QUIET MARKET</text>
  <text class="sub" x="30" y="300">Totals hide it. Per-source charts do not — that is the whole reason the Grafana panel is split.</text>
  <text class="num" x="970" y="278" text-anchor="end">minutes, not nightly</text>
  <text class="sub" x="970" y="300" text-anchor="end">every table rebuildable by replay</text>
</svg>
